<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="簡單、可在瀏覽器本機保存的待辦清單。">
  <title>待辦清單｜我的小日常</title>
  <link rel="stylesheet" href="./styles.css?v=20261112-7">
  <script type="module" src="./app.js?v=20261112-7"></script>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow"><span class="sparkle" aria-hidden="true">✳</span> MY LITTLE DAY</p>
      <div class="hero-heading">
        <div>
          <h1>把今天，<span>慢慢完成。</span></h1>
          <p class="intro">不用一次做到全部。先記下來，再一步一步來。</p>
        </div>
        <div class="account-panel" aria-live="polite">
          <div id="sign-in" class="sign-in-options">
            <button class="google-button" data-auth-provider="google" type="button">
              <span class="google-mark" aria-hidden="true">G</span>使用 Google 登入
            </button>
            <button class="line-button" data-auth-provider="line" type="button">
              <span class="line-mark" aria-hidden="true">LINE</span>使用 LINE 登入
            </button>
          </div>
          <div id="account-info" class="account-info" hidden>
            <span id="account-name" class="account-name"></span>
            <div class="account-actions">
              <button id="link-google" class="link-button" type="button" hidden>連結 Google</button>
              <button id="link-line" class="link-button" type="button" hidden>連結 LINE</button>
              <button id="sign-out" class="sign-out-button" type="button">登出</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <section class="board" aria-labelledby="list-title">
      <div class="board-top">
        <div>
          <p class="date-label" id="today-label"></p>
          <h2 id="list-title">今日清單</h2>
        </div>
        <p class="count" id="task-count" aria-live="polite">0 件待辦</p>
      </div>

      <form id="todo-form" class="add-form">
        <label class="visually-hidden" for="title">新增一件待辦</label>
        <input id="title" name="title" maxlength="200" placeholder="接下來想完成什麼？" required autocomplete="off">
        <button type="submit" class="add-button"><span aria-hidden="true">＋</span> 新增</button>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>
      <ul id="items" class="items" aria-label="待辦事項"></ul>
      <div id="empty-state" class="empty-state" hidden>
        <span class="empty-icon" aria-hidden="true">☼</span>
        <p>清單還是空的</p>
        <span>新增一件小事，開始今天的步調吧。</span>
      </div>

      <footer class="board-footer">
        <span>✦ 每完成一件，都是一點點進步</span>
        <button id="clear-done" class="clear-button" type="button" hidden>清除已完成</button>
      </footer>
    </section>

    <p class="privacy-note"><span aria-hidden="true">▣</span> 登入後清單會同步至 Firebase；未登入時只保存在這個瀏覽器。</p>
  </main>

  <button id="assistant-toggle" class="assistant-toggle" type="button" aria-expanded="false" aria-controls="assistant-panel">
    <span aria-hidden="true">✦</span> AI 小幫手
  </button>
  <section id="assistant-panel" class="assistant-panel" aria-labelledby="assistant-title" hidden>
    <header class="assistant-header">
      <div>
        <p class="assistant-eyebrow">MY LITTLE DAY</p>
        <h2 id="assistant-title">AI 小幫手</h2>
      </div>
      <button id="assistant-close" class="assistant-close" type="button" aria-label="關閉 AI 小幫手">×</button>
    </header>
    <p class="assistant-hint">可以問我清單裡還有哪些工作，或請我整理一下。</p>
    <div id="assistant-messages" class="assistant-messages" role="log" aria-live="polite" aria-relevant="additions">
      <p class="chat-message chat-message-assistant">嗨！我可以根據目前的待辦清單回答問題。</p>
    </div>
    <form id="assistant-form" class="assistant-form">
      <label class="visually-hidden" for="assistant-input">輸入要詢問的待辦問題</label>
      <textarea id="assistant-input" maxlength="1000" rows="2" placeholder="例如：還有哪些事沒完成？" required></textarea>
      <button id="assistant-send" class="assistant-send" type="submit">送出</button>
    </form>
    <p id="assistant-status" class="assistant-status" role="status" aria-live="polite">問題與目前清單會傳送至 Google Gemini；對話不會儲存在 Firebase。</p>
  </section>
</body>
</html>
